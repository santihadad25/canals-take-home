name: canals-orders

# Users, passwords, database names, ports and URLs come from the .env file next to this one
# (copy .env.example to .env).

services:
  # On its first start, Postgres runs the scripts in db/init: it creates the tables, loads the demo
  # warehouses with their stock and creates the database the tests use.
  db:
    image: postgres:16-alpine
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  geocoding-mock:
    build: ./mocks/geocoding
    ports:
      - "${GEOCODING_MOCK_PORT}:8000"
    volumes:
      - ./mocks/geocoding/addresses.json:/app/addresses.json:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 2s
      timeout: 3s
      retries: 20

  payments-mock:
    build: ./mocks/payments
    ports:
      - "${PAYMENTS_MOCK_PORT}:8000"
    volumes:
      - ./mocks/payments/scenarios.json:/app/scenarios.json:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 2s
      timeout: 3s
      retries: 20

  # The web API: gunicorn with WEB_CONCURRENCY worker processes, each one with its own threads.
  # The processes share nothing but the database.
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      GEOCODING_URL: ${GEOCODING_URL}
      PAYMENTS_URL: ${PAYMENTS_URL}
      WEB_CONCURRENCY: "${WEB_CONCURRENCY}"
    ports:
      - "${API_PORT}:8000"
    depends_on:
      db:
        condition: service_healthy
      geocoding-mock:
        condition: service_healthy
      payments-mock:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Finishes the orders that were left halfway (captures authorized payments, expires orders that
  # never got authorized). Safe to scale: docker compose up -d --scale reconciler=3
  reconciler:
    build: .
    command: python -m app.jobs.reconciler
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      GEOCODING_URL: ${GEOCODING_URL}
      PAYMENTS_URL: ${PAYMENTS_URL}
    depends_on:
      db:
        condition: service_healthy
      geocoding-mock:
        condition: service_healthy
      payments-mock:
        condition: service_healthy

  # Run with: docker compose --profile test run --rm tests
  tests:
    profiles: ["test"]
    build:
      context: .
      target: dev
    command: pytest
    volumes:
      - .:/app
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_TEST_DB}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
